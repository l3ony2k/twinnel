# Synthetic subscription for tests. No real nodes.
port: 7890
socks-port: 7891
allow-lan: true
mode: Rule
log-level: info
external-controller: 127.0.0.1:9090
proxies:
  - {name: node-a, type: ss, server: 192.0.2.1, port: 8388, cipher: aes-128-gcm, password: example}
  - {name: node-b, type: ss, server: 192.0.2.2, port: 8388, cipher: aes-128-gcm, password: example}
proxy-groups:
  - name: PROXY
    type: select
    proxies: [Auto, node-a, node-b, DIRECT]
  - name: Auto
    type: url-test
    url: http://www.gstatic.com/generate_204
    interval: 300
    proxies: [node-a, node-b]
  - name: Google
    type: select
    proxies: [PROXY, node-a, node-b, DIRECT]
  - name: Domestic
    type: select
    proxies: [DIRECT, PROXY]
rules:
  - DOMAIN-SUFFIX,google.com,Google
  - GEOIP,CN,Domestic
  - MATCH,PROXY
