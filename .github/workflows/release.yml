name: release

# A tag v* builds every asset and creates a draft GitHub Release (the owner
# publishes it). Run it by hand (workflow_dispatch) to build everything
# without publishing: the assets are uploaded to the run only.
#
# Minutes: the macOS job is billed at 10x, so it builds only Twinnel.app
# (one universal build); the CLI archives for every OS cross-compile on
# Linux; the Linux app (both architectures, AppImages, PKGBUILD) builds on
# Linux too, and so does the Windows app. Builds are signed ad hoc: no Developer ID, no notarization
# (docs/install.md says how to open them).

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      dry_run:
        description: Build everything, publish nothing (a tag ref with dry_run off creates the draft release)
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  # Tag push or a run on a tag ref: 1.2.3 from v1.2.3. Otherwise empty, and
  # build-release.sh uses `git describe` (0.0.0-<n>-g<hash> before the first tag).
  VERSION: ${{ github.ref_type == 'tag' && github.ref_name || '' }}

jobs:
  cli:
    name: CLI + helper (macOS, Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # git describe for untagged dry runs
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - name: test
        run: go test ./...
      - name: build
        run: |
          set -- --no-app --targets "darwin/arm64 darwin/amd64 linux/amd64 linux/arm64"
          if [ -n "$VERSION" ]; then set -- "$@" -v "${VERSION#v}"; fi
          scripts/build-release.sh "$@"
      - name: check the version stamp
        run: |
          trap 'echo "::error::check failed (line $LINENO): $BASH_COMMAND"' ERR
          fail() { echo "::error::$*"; exit 1; }
          arc=$(ls dist/twinnel_*_linux_amd64.tar.gz)
          want=${arc#dist/twinnel_}; want=${want%_linux_amd64.tar.gz}
          tmp=$(mktemp -d)
          tar -C "$tmp" -xzf "$arc"
          d="$tmp/${arc#dist/}"; d=${d%.tar.gz}
          for t in darwin/arm64 darwin/amd64 linux/amd64 linux/arm64; do
            test -f "dist/twinnel_${want}_${t%/*}_${t#*/}.tar.gz" || fail "missing dist/twinnel_${want}_${t%/*}_${t#*/}.tar.gz"
          done
          for a in amd64 arm64; do
            x="$tmp/linux_$a"; mkdir -p "$x"; tar -C "$x" -xzf "dist/twinnel_${want}_linux_${a}.tar.gz"
            scripts/check-binary.sh elf "$x/twinnel_${want}_linux_${a}/twinnel" "$a"
            scripts/check-binary.sh elf "$x/twinnel_${want}_linux_${a}/twinnel-helper" "$a"
          done
          got=$("$d/twinnel" version --short); [ "$got" = "$want" ] || fail "twinnel version --short: '$got', want '$want'"
          got=$("$d/twinnel-helper" -version); [ "$got" = "twinnel-helper $want" ] || fail "twinnel-helper -version: '$got', want 'twinnel-helper $want'"
          for f in install.sh:x twinnel-helper.service:f INSTALL.md:f; do
            test -"${f#*:}" "$d/${f%:*}" || fail "${f%:*} missing (or not executable) in $arc"
          done
          plan=$("$d/install.sh" --dry-run)
          case "$plan" in *'/etc/systemd/system/twinnel-helper.service'*) ;; *) echo "$plan"; fail "install.sh --dry-run does not install the systemd unit" ;; esac
          echo "version $want"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cli
          path: dist/*.tar.gz
          if-no-files-found: error
          retention-days: 7

  app:
    name: Twinnel.app (macOS universal)
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - name: Xcode with actool
        # The layered macOS 26 icon needs actool from Xcode 26 or later. The
        # image's default Xcode is 26.x; fall back to the newest installed one.
        run: |
          if ! xcrun --find actool >/dev/null 2>&1; then
            xcode=$(find /Applications -maxdepth 1 -name 'Xcode_2[6-9]*.app' | sort -V | tail -n 1)
            sudo xcode-select -s "$xcode"
          fi
          xcodebuild -version
          xcrun --find actool
      - name: build
        env:
          TWINNEL_REQUIRE_LAYERED_ICON: "1"
        run: |
          set -- --targets "" --app-platform darwin/universal
          if [ -n "$VERSION" ]; then set -- "$@" -v "${VERSION#v}"; fi
          scripts/build-release.sh "$@"
      - name: check the app
        run: |
          trap 'echo "::error::check failed (line $LINENO): $BASH_COMMAND"' ERR
          fail() { echo "::error::$*"; exit 1; }
          app=dist/app/darwin-universal/Twinnel.app
          test -d "$app" || app=$(find dist/app -maxdepth 2 -name Twinnel.app -type d | head -n 1)
          test -d "$app" || fail "no Twinnel.app under dist/app"
          plist="$app/Contents/Info.plist"
          test -f "$app/Contents/Resources/Assets.car" || fail "no Assets.car (layered icon) in $app"
          got=$(plutil -extract CFBundleIconName raw "$plist" || true)
          [ "$got" = twinnel ] || fail "CFBundleIconName: '$got', want 'twinnel'"
          plutil -extract CFBundleIconFile raw "$plist" >/dev/null || fail "no CFBundleIconFile in $plist"
          for f in "$app/Contents/MacOS/Twinnel" "$app/Contents/Resources/bin/twinnel" "$app/Contents/Resources/bin/twinnel-helper"; do
            got=$(lipo -archs "$f" | tr ' ' '\n' | sort | tr '\n' ' ')
            [ "$got" = 'arm64 x86_64 ' ] || fail "$f: architectures '$got', want 'arm64 x86_64'"
          done
          codesign --verify --deep --strict "$app" || fail "codesign --verify failed for $app"
          zip=$(ls dist/Twinnel_*_macos_universal.zip)
          want=${zip#dist/Twinnel_}; want=${want%_macos_universal.zip}
          got=$("$app/Contents/Resources/bin/twinnel" version --short)
          [ "$got" = "$want" ] || fail "twinnel version --short: '$got', want '$want'"
          test -f "dist/Twinnel_${want}_macos_universal.dmg" || fail "missing dist/Twinnel_${want}_macos_universal.dmg"
          echo "Twinnel.app $want ($(plutil -extract CFBundleShortVersionString raw "$plist"))"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: app
          path: |
            dist/*.dmg
            dist/*.zip
          if-no-files-found: error
          compression-level: 0 # already compressed
          retention-days: 7

  linux-app:
    name: Twinnel (Linux GUI, amd64 + arm64)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - name: tools
        # mksquashfs for the AppImages, desktop-file-validate for the check.
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq squashfs-tools desktop-file-utils
      - name: build
        # Pure Go: mygo cross-compiles both architectures here; the
        # AppImage runtime is pinned in scripts/package-linux-app.sh.
        run: |
          set -- --targets "" --app-platform linux/amd64,linux/arm64 --appimage
          if [ -n "$VERSION" ]; then set -- "$@" -v "${VERSION#v}"; fi
          scripts/build-release.sh "$@"
      - name: check the archives and the AppImages
        run: |
          trap 'echo "::error::check failed (line $LINENO): $BASH_COMMAND"' ERR
          fail() { echo "::error::$*"; exit 1; }
          arc=$(ls dist/Twinnel_*_linux_amd64_app.tar.gz)
          want=${arc#dist/Twinnel_}; want=${want%_linux_amd64_app.tar.gz}
          tmp=$(mktemp -d)
          for a in amd64 arm64; do
            tar -C "$tmp" -xzf "dist/Twinnel_${want}_linux_${a}_app.tar.gz"
            d="$tmp/Twinnel_${want}_linux_${a}_app"
            for f in Twinnel bin/twinnel bin/twinnel-helper install.sh uninstall.sh; do
              test -x "$d/$f" || fail "$f missing or not executable in Twinnel_${want}_linux_${a}_app.tar.gz"
            done
            for f in Twinnel bin/twinnel bin/twinnel-helper; do scripts/check-binary.sh elf "$d/$f" "$a"; done
            for f in scalable/apps/twinnel.svg symbolic/apps/twinnel-symbolic.svg; do
              test -f "$d/share/icons/hicolor/$f" || fail "icon $f missing in Twinnel_${want}_linux_${a}_app.tar.gz"
            done
            scripts/check-binary.sh elf "dist/Twinnel_${want}_linux_${a}.AppImage" "$a"
          done
          d="$tmp/Twinnel_${want}_linux_amd64_app"
          desktop-file-validate "$d/share/applications/twinnel.desktop" || fail "desktop-file-validate: share/applications/twinnel.desktop"
          got=$("$d/bin/twinnel" version --short); [ "$got" = "$want" ] || fail "twinnel version --short: '$got', want '$want'"
          got=$("$d/bin/twinnel-helper" -version); [ "$got" = "twinnel-helper $want" ] || fail "twinnel-helper -version: '$got', want 'twinnel-helper $want'"
          # install.sh / uninstall.sh into a scratch home, without the helper.
          home="$tmp/home"; mkdir -p "$home"
          HOME="$home" "$d/install.sh" --no-helper
          test -x "$home/.local/lib/twinnel/Twinnel" || fail "install.sh: no ~/.local/lib/twinnel/Twinnel"
          got=$("$home/.local/bin/twinnel" version --short); [ "$got" = "$want" ] || fail "installed twinnel version --short: '$got', want '$want'"
          grep -qx "Exec=$home/.local/lib/twinnel/Twinnel" "$home/.local/share/applications/twinnel.desktop" ||
            fail "installed twinnel.desktop: Exec is not $home/.local/lib/twinnel/Twinnel"
          plan=$(HOME="$home" "$d/install.sh" --dry-run)
          case "$plan" in *'helper install'*) ;; *) echo "$plan"; fail "install.sh --dry-run does not install the helper" ;; esac
          HOME="$home" "$d/uninstall.sh" --keep-helper
          # update-desktop-database and gtk-update-icon-cache rebuild these
          # caches after the uninstall; they index the whole directory (other
          # apps too), so they stay.
          left=$(find "$home/.local" \( -type f -o -type l \) ! -name mimeinfo.cache ! -name icon-theme.cache)
          [ -z "$left" ] || fail "uninstall.sh left files behind: $left"
          # The AppImage, unpacked without FUSE; AppRun's cli copies the
          # tools out of the image.
          (cd "$tmp" && "$GITHUB_WORKSPACE/dist/Twinnel_${want}_linux_amd64.AppImage" --appimage-extract >/dev/null) ||
            fail "Twinnel_${want}_linux_amd64.AppImage --appimage-extract failed"
          for f in AppRun usr/lib/twinnel/Twinnel; do
            test -x "$tmp/squashfs-root/$f" || fail "$f missing or not executable in the AppImage"
          done
          desktop-file-validate "$tmp/squashfs-root/twinnel.desktop" || fail "desktop-file-validate: the AppImage's twinnel.desktop"
          got=$(HOME="$home" "$tmp/squashfs-root/AppRun" cli version --short)
          [ "$got" = "$want" ] || fail "AppImage cli version --short: '$got', want '$want'"
          test -x "$home/.cache/twinnel/appimage/$want/twinnel-helper" || fail "AppRun did not copy twinnel-helper to ~/.cache/twinnel/appimage/$want"
          echo "Linux app $want"
      - name: check the PKGBUILD (makepkg in Arch Linux)
        run: |
          docker run --rm -v "$PWD/dist:/dist:ro" archlinux:base-devel bash -euc '
            useradd -m build
            cp /dist/PKGBUILD /dist/twinnel-bin.install /dist/Twinnel_*_linux_amd64_app.tar.gz /home/build/
            chown -R build /home/build
            su build -c "cd ~ && makepkg --nodeps --noconfirm"
            pkg=$(ls /home/build/twinnel-bin-*.pkg.tar.zst)
            pacman -Qlpq "$pkg" | grep -qx /opt/twinnel/Twinnel
            pacman -Qlpq "$pkg" | grep -qx /usr/bin/twinnel
            pacman -Qlpq "$pkg" | grep -qx /usr/share/applications/twinnel.desktop
            pacman -Qlpq "$pkg" | grep -qx /usr/share/icons/hicolor/scalable/apps/twinnel.svg
            pacman -Qip "$pkg"
          '
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux-app
          path: |
            dist/*_app.tar.gz
            dist/*.AppImage
            dist/PKGBUILD
            dist/twinnel-bin.install
          if-no-files-found: error
          compression-level: 0 # already compressed
          retention-days: 7

  # windows:
  #   Not yet: the Windows platform layer is being built on another branch.
  #   When it lands, cross-compile the CLI + helper in the cli job (add
  #   windows/amd64 and windows/arm64 to --targets, as .zip) and, for the GUI,
  #   add a job like this one:
  #   name: Twinnel (Windows)
  #   runs-on: windows-latest
  #   steps:
  #     - checkout + setup-go as above
  #     - run: go run github.com/egoist/mygo/cmd/mygo@<go.mod version> build -platform windows/amd64,windows/arm64 -o dist/app cmd/app
  #     - upload-artifact: name windows, path dist/app/**/*.exe
  #   and list it in release.needs. Unsigned (no Authenticode certificate):
  #   SmartScreen shows "More info → Run anyway"; say so in docs/install.md.

  windows:
    name: Twinnel (Windows amd64, arm64)
    # Cross-compiled on Linux (pure Go; mygo build makes the exe's icon,
    # version info and manifest on any host). Unsigned: no Authenticode
    # certificate, SmartScreen warns (docs/install.md).
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - name: vet for Windows
        run: |
          GOOS=windows GOARCH=amd64 go vet ./...
          GOOS=windows GOARCH=arm64 go vet ./cmd/... ./platform/windows/...
      - name: parse install.ps1
        shell: pwsh
        run: |
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile("$PWD/packaging/windows/install.ps1", [ref]$null, [ref]$errors) | Out-Null
          if ($errors) { $errors | ForEach-Object { Write-Error $_.ToString() }; exit 1 }
      - name: build
        run: |
          set -- --no-app --targets "" --windows-app "windows/amd64 windows/arm64"
          if [ -n "$VERSION" ]; then set -- "$@" -v "${VERSION#v}"; fi
          scripts/build-release.sh "$@"
      - name: check the zips
        run: |
          trap 'echo "::error::check failed (line $LINENO): $BASH_COMMAND"' ERR
          fail() { echo "::error::$*"; exit 1; }
          for arch in amd64 arm64; do
            zip=$(ls dist/Twinnel_*_windows_${arch}.zip)
            name=$(basename "$zip" .zip)
            tmp=$(mktemp -d)
            unzip -q "$zip" -d "$tmp"
            d="$tmp/$name"
            for f in Twinnel.exe bin/twinnel.exe bin/twinnel-helper.exe install.ps1 INSTALL.md; do
              test -f "$d/$f" || fail "missing $f in $zip"
            done
            # From the PE header: file(1) words it differently per version.
            scripts/check-binary.sh pe "$d/Twinnel.exe" "$arch" gui
            scripts/check-binary.sh pe "$d/bin/twinnel.exe" "$arch" console
            scripts/check-binary.sh pe "$d/bin/twinnel-helper.exe" "$arch" console
            if grep -qaF WebView2Loader "$d/Twinnel.exe"; then fail "WebView2Loader linked into Twinnel.exe in $zip"; fi
            echo "$zip ok"
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows
          path: dist/*.zip
          if-no-files-found: error
          compression-level: 0 # already compressed
          retention-days: 7

  release:
    name: Checksums, notes, draft release
    needs: [cli, app, linux-app, windows]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # tags and history for the notes
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist-release # not assets/: that is a source folder in the checkout
          merge-multiple: true
      - name: SHA256SUMS
        working-directory: dist-release
        run: |
          find . -maxdepth 1 -type f -printf "%f\0" | sort -z | xargs -0 sha256sum -- > "$RUNNER_TEMP/SHA256SUMS"
          mv "$RUNNER_TEMP/SHA256SUMS" SHA256SUMS
          cat SHA256SUMS
      - name: release notes
        run: |
          head=$(git rev-parse HEAD)
          prev=$(git describe --tags --abbrev=0 --match 'v*' "${head}^" 2>/dev/null || true)
          if [ -n "$prev" ]; then range="$prev..$head"; since="since $prev"; else range="$head"; since="(first release)"; fi
          count=$(git rev-list --no-merges --count "$range")
          {
            echo "Unsigned build (ad-hoc signature, not notarized). How to install and open it: [docs/install.md](https://github.com/${GITHUB_REPOSITORY}/blob/${GITHUB_SHA}/docs/install.md)."
            echo
            echo "| Asset | For |"
            echo "|---|---|"
            echo "| \`Twinnel_*_macos_universal.dmg\` / \`.zip\` | Twinnel.app, macOS 15+ (Apple silicon and Intel) |"
            echo "| \`twinnel_*_darwin_<arch>.tar.gz\` | macOS CLI and helper only |"
            echo "| \`twinnel_*_linux_<arch>.tar.gz\` | Linux CLI and helper (systemd), \`sudo ./install.sh\` |"
            echo "| \`Twinnel_*_linux_<arch>_app.tar.gz\` | Twinnel for Linux (app, CLI, helper; systemd), \`./install.sh\` |"
            echo "| \`Twinnel_*_linux_<arch>.AppImage\` | Twinnel for Linux in one file (needs FUSE 2) |"
            echo "| \`PKGBUILD\` + \`twinnel-bin.install\` | Arch Linux: \`makepkg -si\` in a folder with both |"
            echo "| \`Twinnel_*_windows_<arch>.zip\` | Twinnel for Windows 10 1809+ / 11 (x64, Arm64): unzip, then \`powershell -ExecutionPolicy Bypass -File .\\install.ps1\` (unsigned: SmartScreen warns) |"
            echo "| \`SHA256SUMS\` | \`shasum -a 256 -c SHA256SUMS --ignore-missing\` |"
            echo
            echo "## Changes $since"
            echo
            git log --no-merges --format='- %s (%h)' -n 300 "$range"
            if [ "$count" -gt 300 ]; then echo "- … and $((count - 300)) earlier commits"; fi
          } > notes.md
          cat notes.md
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release
          path: |
            dist-release/SHA256SUMS
            notes.md
          retention-days: 7
      - name: create the draft release
        if: github.ref_type == 'tag' && (github.event_name == 'push' || !inputs.dry_run)
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          flags=(--draft --verify-tag)
          case "$TAG" in *-*) flags+=(--prerelease) ;; esac
          if gh release view "$TAG" >/dev/null 2>&1; then
            # A rerun: replace the assets of the existing (draft) release.
            gh release upload "$TAG" dist-release/* --clobber
          else
            gh release create "$TAG" dist-release/* "${flags[@]}" \
              --title "Twinnel ${TAG#v}" --notes-file notes.md
          fi
      - name: dry run
        if: ${{ !(github.ref_type == 'tag' && (github.event_name == 'push' || !inputs.dry_run)) }}
        run: |
          echo "dry run: nothing published. Assets:" >> "$GITHUB_STEP_SUMMARY"
          (cd dist-release && ls -l) >> "$GITHUB_STEP_SUMMARY"
