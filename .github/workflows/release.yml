name: release

# A tag v* builds every asset and creates a draft GitHub Release (the owner
# publishes it). Run it by hand (workflow_dispatch) to build everything
# without publishing: the assets are uploaded to the run only.
#
# Minutes: the macOS job is billed at 10x, so it builds only Twinnel.app
# (one universal build); the CLI archives for every OS cross-compile on
# Linux, the Windows app too. Builds are signed ad hoc: no Developer ID, no notarization
# (docs/install.md says how to open them).

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      dry_run:
        description: Build everything, publish nothing (a tag ref with dry_run off creates the draft release)
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  # Tag push or a run on a tag ref: 1.2.3 from v1.2.3. Otherwise empty, and
  # build-release.sh uses `git describe` (0.0.0-<n>-g<hash> before the first tag).
  VERSION: ${{ github.ref_type == 'tag' && github.ref_name || '' }}

jobs:
  cli:
    name: CLI + helper (macOS, Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # git describe for untagged dry runs
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - name: test
        run: go test ./...
      - name: build
        run: |
          set -- --no-app --targets "darwin/arm64 darwin/amd64 linux/amd64 linux/arm64"
          if [ -n "$VERSION" ]; then set -- "$@" -v "${VERSION#v}"; fi
          scripts/build-release.sh "$@"
      - name: check the version stamp
        run: |
          arc=$(ls dist/twinnel_*_linux_amd64.tar.gz)
          want=${arc#dist/twinnel_}; want=${want%_linux_amd64.tar.gz}
          tmp=$(mktemp -d)
          tar -C "$tmp" -xzf "$arc"
          d="$tmp/${arc#dist/}"; d=${d%.tar.gz}
          test "$("$d/twinnel" version --short)" = "$want"
          test "$("$d/twinnel-helper" -version)" = "twinnel-helper $want"
          test -x "$d/install.sh" && test -f "$d/twinnel-helper.service" && test -f "$d/INSTALL.md"
          "$d/install.sh" --dry-run | grep -q '/etc/systemd/system/twinnel-helper.service'
          echo "version $want"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cli
          path: dist/*.tar.gz
          if-no-files-found: error
          retention-days: 7

  app:
    name: Twinnel.app (macOS universal)
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - name: Xcode with actool
        # The layered macOS 26 icon needs actool from Xcode 26 or later. The
        # image's default Xcode is 26.x; fall back to the newest installed one.
        run: |
          if ! xcrun --find actool >/dev/null 2>&1; then
            xcode=$(find /Applications -maxdepth 1 -name 'Xcode_2[6-9]*.app' | sort -V | tail -n 1)
            sudo xcode-select -s "$xcode"
          fi
          xcodebuild -version
          xcrun --find actool
      - name: build
        env:
          TWINNEL_REQUIRE_LAYERED_ICON: "1"
        run: |
          set -- --targets "" --app-platform darwin/universal
          if [ -n "$VERSION" ]; then set -- "$@" -v "${VERSION#v}"; fi
          scripts/build-release.sh "$@"
      - name: check the app
        run: |
          app=dist/app/darwin-universal/Twinnel.app
          test -d "$app" || app=$(find dist/app -maxdepth 2 -name Twinnel.app -type d | head -n 1)
          plist="$app/Contents/Info.plist"
          test -f "$app/Contents/Resources/Assets.car"
          plutil -extract CFBundleIconName raw "$plist" | grep -qx twinnel
          plutil -extract CFBundleIconFile raw "$plist"
          for f in "$app/Contents/MacOS/Twinnel" "$app/Contents/Resources/bin/twinnel" "$app/Contents/Resources/bin/twinnel-helper"; do
            lipo -archs "$f" | tr ' ' '\n' | sort | tr '\n' ' ' | grep -qx 'arm64 x86_64 '
          done
          codesign --verify --deep --strict "$app"
          zip=$(ls dist/Twinnel_*_macos_universal.zip)
          want=${zip#dist/Twinnel_}; want=${want%_macos_universal.zip}
          test "$("$app/Contents/Resources/bin/twinnel" version --short)" = "$want"
          test -f "dist/Twinnel_${want}_macos_universal.dmg"
          echo "Twinnel.app $want ($(plutil -extract CFBundleShortVersionString raw "$plist"))"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: app
          path: |
            dist/*.dmg
            dist/*.zip
          if-no-files-found: error
          compression-level: 0 # already compressed
          retention-days: 7

  windows:
    name: Twinnel (Windows amd64, arm64)
    # Cross-compiled on Linux (pure Go; mygo build makes the exe's icon,
    # version info and manifest on any host). Unsigned: no Authenticode
    # certificate, SmartScreen warns (docs/install.md).
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - name: vet for Windows
        run: |
          GOOS=windows GOARCH=amd64 go vet ./...
          GOOS=windows GOARCH=arm64 go vet ./cmd/... ./platform/windows/...
      - name: parse install.ps1
        shell: pwsh
        run: |
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile("$PWD/packaging/windows/install.ps1", [ref]$null, [ref]$errors) | Out-Null
          if ($errors) { $errors | ForEach-Object { Write-Error $_.ToString() }; exit 1 }
      - name: build
        run: |
          set -- --no-app --targets "" --windows-app "windows/amd64 windows/arm64"
          if [ -n "$VERSION" ]; then set -- "$@" -v "${VERSION#v}"; fi
          scripts/build-release.sh "$@"
      - name: check the zips
        run: |
          for arch in amd64 arm64; do
            zip=$(ls dist/Twinnel_*_windows_${arch}.zip)
            name=$(basename "$zip" .zip)
            tmp=$(mktemp -d)
            unzip -q "$zip" -d "$tmp"
            d="$tmp/$name"
            for f in Twinnel.exe bin/twinnel.exe bin/twinnel-helper.exe install.ps1 INSTALL.md; do
              test -f "$d/$f" || { echo "missing $f in $zip"; exit 1; }
            done
            file "$d/Twinnel.exe" | grep -q 'PE32+ executable (GUI)'
            if grep -q WebView2Loader "$d/Twinnel.exe"; then echo "WebView2 linked into $zip"; exit 1; fi
            echo "$zip ok"
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows
          path: dist/*.zip
          if-no-files-found: error
          compression-level: 0 # already compressed
          retention-days: 7

  release:
    name: Checksums, notes, draft release
    needs: [cli, app, windows]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # tags and history for the notes
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: assets
          merge-multiple: true
      - name: SHA256SUMS
        working-directory: assets
        run: |
          sha256sum -- * > SHA256SUMS
          cat SHA256SUMS
      - name: release notes
        run: |
          head=$(git rev-parse HEAD)
          prev=$(git describe --tags --abbrev=0 --match 'v*' "${head}^" 2>/dev/null || true)
          if [ -n "$prev" ]; then range="$prev..$head"; since="since $prev"; else range="$head"; since="(first release)"; fi
          count=$(git rev-list --no-merges --count "$range")
          {
            echo "Unsigned build (ad-hoc signature, not notarized). How to install and open it: [docs/install.md](https://github.com/${GITHUB_REPOSITORY}/blob/${GITHUB_SHA}/docs/install.md)."
            echo
            echo "| Asset | For |"
            echo "|---|---|"
            echo "| \`Twinnel_*_macos_universal.dmg\` / \`.zip\` | Twinnel.app, macOS 15+ (Apple silicon and Intel) |"
            echo "| \`twinnel_*_darwin_<arch>.tar.gz\` | macOS CLI and helper only |"
            echo "| \`twinnel_*_linux_<arch>.tar.gz\` | Linux CLI and helper (systemd), \`sudo ./install.sh\` |"
            echo "| \`Twinnel_*_windows_<arch>.zip\` | Twinnel for Windows 10 1809+ / 11 (x64, Arm64): unzip, then \`powershell -ExecutionPolicy Bypass -File .\\install.ps1\` (unsigned: SmartScreen warns) |"
            echo "| \`SHA256SUMS\` | \`shasum -a 256 -c SHA256SUMS --ignore-missing\` |"
            echo
            echo "## Changes $since"
            echo
            git log --no-merges --format='- %s (%h)' -n 300 "$range"
            if [ "$count" -gt 300 ]; then echo "- … and $((count - 300)) earlier commits"; fi
          } > notes.md
          cat notes.md
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release
          path: |
            assets/SHA256SUMS
            notes.md
          retention-days: 7
      - name: create the draft release
        if: github.ref_type == 'tag' && (github.event_name == 'push' || !inputs.dry_run)
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          flags=(--draft --verify-tag)
          case "$TAG" in *-*) flags+=(--prerelease) ;; esac
          if gh release view "$TAG" >/dev/null 2>&1; then
            # A rerun: replace the assets of the existing (draft) release.
            gh release upload "$TAG" assets/* --clobber
          else
            gh release create "$TAG" assets/* "${flags[@]}" \
              --title "Twinnel ${TAG#v}" --notes-file notes.md
          fi
      - name: dry run
        if: ${{ !(github.ref_type == 'tag' && (github.event_name == 'push' || !inputs.dry_run)) }}
        run: |
          echo "dry run: nothing published. Assets:" >> "$GITHUB_STEP_SUMMARY"
          (cd assets && ls -l) >> "$GITHUB_STEP_SUMMARY"
