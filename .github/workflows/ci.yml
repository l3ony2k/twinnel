name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - name: gofmt
        run: |
          out=$(gofmt -l .)
          if [ -n "$out" ]; then
            echo "files need gofmt:"; echo "$out"; exit 1
          fi
      - name: vet
        run: go vet ./...
      - name: test
        # Tests never touch the live system: write paths use fakes and temp
        # dirs; tests against a real mihomo / tailscaled need -tags live.
        run: go test ./...

  windows:
    # The Windows platform layer, natively: pipe transport and peer SIDs,
    # SCM plans, DPAPI, the health Env over fixtures, kernel zips, UAC
    # elevation with a fake prompt. Packages whose tests assume Unix paths
    # or modes stay on the Unix jobs. Nothing here touches the runner's
    # services or network settings.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - name: vet
        run: go vet ./...
      - name: test
        run: >-
          go test ./core/rpc/... ./core/priv ./core/service ./core/kernel
          ./core/health/... ./core/tailscale ./core/uninstall ./platform/common
          ./platform/windows/...
      - name: install.ps1 end to end (Windows PowerShell 5.1 and PowerShell 7)
        # The whole script under both shells in temp dirs: install, upgrade
        # while programs run from the install, dry runs, uninstall. It
        # changes the runner user's PATH and Start menu, then puts them back.
        env:
          TWINNEL_INSTALL_E2E: "1"
        run: go test -v -count=1 ./packaging/windows
      - name: test (cli elevation)
        run: go test -run Windows ./cmd/cli
      - name: test (app, Windows parts)
        run: >-
          go test ./core/i18n && go test ./cmd/app -run
          "Windows|TrayIconPx|AppRemoval|EncodePowerShell|BundleFromExe|CmdQuote|ParsePlan"
      - name: shot flows (default, lifecycle, components)
        # The app's shot runs on a hermetic stack (fake controller, scratch
        # helper on its own pipe, unelevated, synthetic tailnet, scratch
        # profile): every flow must finish and never save the same picture
        # twice. Allowed to fail until a runner has shown it can render
        # the hidden windows; see HANDOFF (winui-r5).
        continue-on-error: true
        shell: bash
        run: scripts/e2e/shot-flows.sh "$RUNNER_TEMP/twinnel-shots" default lifecycle components
      - name: shot flow output
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: shot-flows-windows
          path: ${{ runner.temp }}/twinnel-shots/out
          if-no-files-found: ignore

  cross-build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [windows/amd64, windows/arm64, linux/arm64, darwin/amd64]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - name: build ${{ matrix.target }}
        env:
          CGO_ENABLED: "0"
          TARGET: ${{ matrix.target }}
        run: |
          export GOOS=${TARGET%/*} GOARCH=${TARGET#*/}
          go build ./...
          go vet ./...
        shell: bash
      - name: release script (CLI only)
        if: matrix.target == 'linux/arm64'
        run: scripts/build-release.sh --no-app -v ci
