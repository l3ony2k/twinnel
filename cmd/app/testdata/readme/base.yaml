# Base layer for the README screenshots (synthetic).
mixed-port: 7890
external-controller: 127.0.0.1:19894
dns:
  enable: true
  listen: 127.0.0.1:1053
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  nameserver:
    - https://1.1.1.1/dns-query
tun:
  enable: true
  stack: mixed
  auto-route: true
  dns-hijack:
    - any:53
